name = "collatz-github"
version = "0.1.0"
keywords = ["math", "collatz"]
defaultTargets = ["ChristoffelNeighbourhood"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.0-rc2"

